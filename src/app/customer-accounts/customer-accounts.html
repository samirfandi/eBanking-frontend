
<div>

    <span>ID :</span>
    <span> {{accountId}}</span>
</div>

<div>
    <div>Customer</div>
   <div>
    {{customer | json}}
   </div>

   <div class="card border-0 shadow-sm m-3">
    <div class="card-header">
        My accounts 
    </div>
    <div class="card-body">
        <table class="table">
            <thead>
                <th> Id </th> <th> type</th> <th>balance </th> <th>created at </th> <th>status</th>
            </thead>
            <tbody>
                @if (customerAccounts() | async; as accounts) {
                    @for (acc of accounts; track acc) {
                        <tr>
                            <td> {{acc.id}}</td>
                            <td>null</td>
                            <td> {{acc.Balance}}</td>
                            <td> {{acc.createdAt }}</td>
                            <td>{{acc.status}}</td>
                        </tr>
                    }
                }
            </tbody>
        </table>
    </div>

   </div>

</div>
